# vault-integrity — машинная сверка шифротекстов релиза.
# ФАКТЫ, не обещания: каждая строка __SHA256SUMS.txt обязана иметь живой ассет,
# выборочные шифротексты обязаны сходиться по sha256. Расшифровки нет — только
# хеши (закон клетки: ключи не входят в CI).
name: vault-integrity — сверка шифротекстов

on:
  schedule:
    - cron: "43 5 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault-integrity
  cancel-in-progress: false

jobs:
  verify:
    name: Структурная сверка + выборочные хеши
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Сверка всех релизов (структура) и выборочных хешей (sha256)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate > /tmp/releases.json
          python3 - <<'PYEOF'
          import json, os, subprocess, sys

          REPO = os.environ["GITHUB_REPOSITORY"]
          releases = json.load(open("/tmp/releases.json"))
          if not releases:
              sys.exit("ФАКТ: релизов нет — сверять нечего (сейф пуст?)")
          total_assets = total_lines = 0
          sampled = checked = 0
          failures = []
          for rel in releases:
              tag = rel["tag_name"]
              tag_safe = tag.replace("/", "_")
              assets = {a["name"]: a for a in rel["assets"]}
              sums_name = next((n for n in assets if n.endswith("__SHA256SUMS.txt")), None)
              print(f"ФАКТ: релиз {tag}: ассетов {len(assets)}, sums={'да' if sums_name else 'НЕТ'}")
              if sums_name is None:
                  failures.append(f"{tag}: нет __SHA256SUMS.txt")
                  continue
              p = f"/tmp/{tag_safe}__SHA256SUMS.txt"
              data = subprocess.run(["gh", "api", f"repos/{REPO}/releases/assets/{assets[sums_name]['id']}",
                                    "-H", "Accept: application/octet-stream"],
                                   capture_output=True, check=True).stdout
              open(p, "w", encoding="utf-8", errors="replace").write(data.decode("utf-8", "replace"))
              lines = []
              for raw in open(p, encoding="utf-8", errors="replace"):
                  raw = raw.strip()
                  if not raw or raw.startswith("#"):
                      continue
                  h, _, name = raw.partition("  ")
                  lines.append((h.strip(), name.strip().lstrip("*")))
              total_lines += len(lines)
              # 1) каждая строка sums обязана иметь живой ассет (fail-closed)
              for h, name in lines:
                  total_assets += 1
                  if name not in assets:
                      failures.append(f"{tag}: sums ссылается на отсутствующий ассет {name}")
              # 2) каждый .enc-ассет обязан быть в sums (иначе инвентарь неполон)
              enc_missing = [n for n in assets if n.endswith(".enc") and
                             n not in {name for _, name in lines}]
              if enc_missing:
                  print(f"ПРЕДУПРЕЖДЕНИЕ: {tag}: .enc без строки в sums: {enc_missing}")
              # 3) выборочно: 3 наименьших .enc из sums — скачать и сверить sha256
              have = {name: h for h, name in lines if name in assets}
              small = sorted(((assets[n]["size"], n) for n in have))[:3]
              os.makedirs("/tmp/vault", exist_ok=True)
              for size, name in small:
                  dst = f"/tmp/vault/{name}"
                  raw = subprocess.run(["gh", "api",
                                        f"repos/{REPO}/releases/assets/{assets[name]['id']}",
                                        "-H", "Accept: application/octet-stream"],
                                       capture_output=True, check=True).stdout
                  open(dst, "wb").write(raw)
                  hh = subprocess.run(["sha256sum", dst], capture_output=True, text=True,
                                      check=True).stdout.split()[0]
                  sampled += 1
                  if hh == have[name]:
                      checked += 1
                      print(f"ФАКТ: {tag}/{name}: sha256 сходится ({size} байт)")
                  else:
                      failures.append(f"{tag}/{name}: sha256 НЕ сходится")
          print(f"ИТОГ: релизов {len(releases)}, строк sums {total_lines}, "
                f"выборочно сверено {checked}/{sampled}")
          if failures:
              print("ФАКТ: НАРУШЕНИЯ:")
              for f in failures:
                  print("  -", f)
              sys.exit(1)
          print("ФАКТ: сейф цел — структура и выборочные хеши сходятся")
          PYEOF

  manifest-seal:
    name: Пломба манифеста хранилища (день пломбы · W3-A2)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Самотест пломбировщика
        run: python3 wave3/seal_manifest.py --selftest
      - name: "Пломба манифеста — потери 🔴, устаревание 🟡 (soft)"
        run: python3 wave3/seal_manifest.py --soft
